[project]
name = "credit-engine"
version = "0.1.0"
description = "Mortgage credit decision engine: calibrated PD, expected profit and portfolio optimisation on a Databricks Medallion lakehouse."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added in the roadmap week that first needs them
# (pyspark/delta in week 2, lightgbm/mlflow in week 5, pulp in week 6).
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
